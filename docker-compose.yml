services:
  electricity-bill:
    build:
      context: .
      dockerfile: Dockerfile
    image: electricity-bill-calculation:latest
    container_name: electricity-bill-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: electricity-bill-jenkins:latest
    container_name: electricity-bill-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/casc.yaml:/var/jenkins_home/casc.yaml:ro
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
